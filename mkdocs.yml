site_name: "Engineering Fundamentals"
site_url: ""

docs_dir: docs

theme:
  name: "material"
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/white-balance-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Module 1:
      - Overview: module1/overview.md
      - Theory: module1/theory.md
      - Quiz: module1/quiz.md
      - Demo: module1/demo.md
      - Plotting Demo: module1/plot-demo.md
      - Python Shell: module1/repl.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - js/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - js/quizzes.js
  - js/opencv-demos.js
  - js/repl.js
extra_css:
  - css/custom.css

  
